<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48" role="img" aria-labelledby="logiTrackLogoTitle">
  <title id="logiTrackLogoTitle">LogiTrack logo</title>
  <defs>
    <linearGradient id="ltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <!-- Package / crate -->
  <rect x="10" y="24" width="30" height="26" rx="3" fill="url(#ltGradient)"/>
  <path d="M10 30 L25 22 L40 30" fill="none" stroke="#0f1115" stroke-width="2" stroke-linejoin="round"/>
  <line x1="25" y1="22" x2="25" y2="50" stroke="#0f1115" stroke-width="2"/>

  <!-- Motion / route arrow -->
  <path d="M40 40 h10 M46 34 l6 6 l-6 6" fill="none" stroke="url(#ltGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="54" cy="16" r="4" fill="url(#ltGradient)"/>
  <path d="M18 16 h30" stroke="url(#ltGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
</svg>
